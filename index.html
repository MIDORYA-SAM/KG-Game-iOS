<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#0c1220;color:white;font-family:-apple-system,system-ui,sans-serif}canvas{display:block;width:100%;height:100%}#hud{position:absolute;top:max(20px,env(safe-area-inset-top));left:14px;font-weight:700;font-size:15px;text-shadow:0 2px 3px black}#controls{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 25px;pointer-events:none}.cluster{display:flex;gap:12px}.btn{width:68px;height:68px;border-radius:19px;background:#ffffff2a;border:1px solid #ffffff66;display:grid;place-items:center;font-size:26px;font-weight:bold;pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:none;backdrop-filter:blur(5px)}#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0c1220dd}#panel{text-align:center;padding:25px}#panel h1{font-size:31px;margin:0 0 10px}#panel p{line-height:1.5;color:#c8d3e7}#play{background:#55d6a4;color:#09251c;border:0;padding:15px 35px;border-radius:14px;font-size:18px;font-weight:800}
</style></head><body><canvas id="game"></canvas><div id="hud">KG GAME · Moedas: <span id="coins">0</span> · Vida: <span id="life">3</span></div><div id="controls"><div class="cluster"><div id="left" class="btn">◀</div><div id="right" class="btn">▶</div></div><div class="cluster"><div id="jump" class="btn">↑</div></div></div><div id="start"><div id="panel"><h1>⚔️ KG ADVENTURE</h1><p>Colete moedas, pule plataformas e evite os inimigos.<br>Funciona com toque ou teclado.</p><button id="play">JOGAR</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,scale=1,cam=0,playing=false,coins=0,lives=3,inv=0;const keys={left:false,right:false,jump:false};const player={x:80,y:0,w:28,h:40,vx:0,vy:0,ground:false};const platforms=[{x:0,y:0,w:2200,h:100},{x:230,y:-125,w:170,h:18},{x:480,y:-205,w:150,h:18},{x:750,y:-120,w:160,h:18},{x:1020,y:-210,w:160,h:18},{x:1370,y:-145,w:180,h:18},{x:1740,y:-190,w:180,h:18}];let pickups=[],enemies=[];function resize(){W=window.innerWidth;H=window.innerHeight;scale=Math.max(.75,Math.min(1.4,W/440));canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}window.addEventListener('resize',resize);resize();function ground(){return H-110}function reset(){coins=0;lives=3;cam=0;Object.assign(player,{x:70,y:ground()-40,vx:0,vy:0,ground:false});pickups=Array.from({length:26},(_,i)=>({x:165+i*75,y:ground()-70-(i%4===0?115:0),taken:false}));enemies=[540,940,1290,1680,1950].map(x=>({x,y:ground()-30,w:29,h:30,dir:1}));playing=true;document.getElementById('start').style.display='none';updateHud()}function updateHud(){document.getElementById('coins').textContent=coins;document.getElementById('life').textContent=lives}document.getElementById('play').onclick=reset;for(const name of ['left','right','jump']){const el=document.getElementById(name);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);keys[name]=true});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,()=>keys[name]=false)}window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key===' '||e.key==='w')keys.jump=true});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key===' '||e.key==='w')keys.jump=false});function coll(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function loop(){requestAnimationFrame(loop);const base=ground();if(playing){const priorBottom=player.y+player.h;player.vx=((keys.right?1:0)-(keys.left?1:0))*4.2;player.x=Math.max(0,Math.min(2140,player.x+player.vx));if(keys.jump&&player.ground){player.vy=-12.3;player.ground=false}player.vy=Math.min(13,player.vy+.56);player.y+=player.vy;player.ground=false;for(const p of platforms){const py=base+p.y;if(player.vy>=0&&priorBottom<=py+8&&player.y+player.h>=py&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=py-player.h;player.vy=0;player.ground=true}}for(const c of pickups){if(!c.taken&&Math.abs(player.x+14-c.x)<23&&Math.abs(player.y+20-c.y)<29){c.taken=true;coins++;updateHud()}}for(const e of enemies){e.x+=e.dir*.65;if(e.x<100||e.x>2120)e.dir*=-1;if(inv<=0&&coll(player,e)){lives--;inv=75;player.vy=-7;updateHud();if(lives<=0){playing=false;document.getElementById('start').style.display='flex';document.querySelector('#panel h1').textContent='FIM DE JOGO';document.getElementById('play').textContent='JOGAR NOVAMENTE'}}}if(inv>0)inv--;cam+=(Math.max(0,Math.min(2200-W,player.x-W*.33))-cam)*.1;if(coins===26){playing=false;document.getElementById('start').style.display='flex';document.querySelector('#panel h1').textContent='VOCÊ VENCEU!';document.getElementById('play').textContent='JOGAR NOVAMENTE'}}const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#172341');g.addColorStop(1,'#2d4f68');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff19';for(let i=0;i<55;i++){let x=(i*97-cam*.12)%(W+100);if(x<0)x+=W+100;ctx.fillRect(x,i*57%(Math.max(1,H-100)),2,2)}ctx.save();ctx.translate(-cam,0);for(const p of platforms){const y=base+p.y;ctx.fillStyle='#214e43';ctx.fillRect(p.x,y,p.w,p.h);ctx.fillStyle='#66d99f';ctx.fillRect(p.x,y,p.w,9)}for(const c of pickups){if(c.taken)continue;const y=c.y;ctx.fillStyle='#ffdf6b';ctx.beginPath();ctx.arc(c.x,y,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c88f16';ctx.fillRect(c.x-2,y-6,4,12)}for(const e of enemies){ctx.fillStyle='#d85a6d';ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle='white';ctx.fillRect(e.x+5,e.y+7,5,5);ctx.fillRect(e.x+19,e.y+7,5,5)}if(inv%8<4){ctx.fillStyle='#52d6f1';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle='#0b263d';ctx.fillRect(player.x+6,player.y+10,5,5);ctx.fillRect(player.x+18,player.y+10,5,5)}ctx.restore()}requestAnimationFrame(loop);
</script></body></html>
